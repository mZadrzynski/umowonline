{% extends "myschedule/calendar_sidemenu.html" %}

{% block calendar %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4><i class="bi bi-pencil"></i> Edytuj kalendarz</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label">Nazwa kalendarza:</label>
                    <input type="text" 
                           class="form-control" 
                           id="name" 
                           name="name" 
                           value="{{ calendar.name }}" 
                           required 
                           maxlength="100">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Zapisz
                    </button>
                    <a href="{% url 'calendar_list' %}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Anuluj
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
